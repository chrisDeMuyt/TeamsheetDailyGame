spring:
  application:
    name: teamsheet
  datasource:
    # Local default = docker-compose (host port 5433). In production the container entrypoint sets JDBC_DATABASE_*
    # from Fly's DATABASE_URL.
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5433/teamsheet}
    username: ${JDBC_DATABASE_USERNAME:teamsheet}
    password: ${JDBC_DATABASE_PASSWORD:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none      # Flyway owns the schema
  flyway:
    enabled: true

teamsheet:
  game:
    puzzle-zone: America/Chicago   # new puzzle at midnight US Central (CST/CDT handled automatically)
    guess-seconds: 30
    grace-seconds: 2          # network slack on top of the 30s
    fuzzy-threshold: 0.45     # min trigram score to count as a match
    ambiguity-margin: 0.10    # candidates within this of the top score = ambiguous
    min-fuzzy-length: 3
    live-rarity-min-plays: 200
    sub-bonus: 15
